<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="5DM SEO Audit Platform — generate professional, personalized SEO audits." />
  <title>5DM SEO Audit Platform</title>
  <script>
    // Inject a <base> tag so every relative asset (css/js/images) resolves
    // against the app's real install directory — regardless of whether the
    // user lands on /SEO/, /SEO/BrandName, or a local dev path. This must
    // run before any <link> or <script> tag so speculative loading uses it.
    (function () {
      var p = window.location.pathname;
      var idx = p.toLowerCase().indexOf("/seo");
      var base = (idx === -1) ? "./" : p.slice(0, idx + 4) + "/";
      var el = document.createElement("base");
      el.href = base;
      document.head.insertBefore(el, document.head.firstChild);
    })();
  </script>
  <link rel="icon" href="https://5dm.africa/wp-content/uploads/2025/05/Isolation_Mode.webp" type="image/webp" />
  <link rel="preconnect" href="https://www.googleapis.com" />
  <link rel="preconnect" href="https://api.allorigins.win" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="app-root" aria-live="polite"></div>

  <template id="tpl-auth">
    <section class="auth-screen">
      <div class="auth-card">
        <img class="auth-logo" src="https://5dm.africa/wp-content/uploads/2025/05/Isolation_Mode.webp" alt="5DM" />
        <h1 class="auth-title">5DM SEO Audit Platform</h1>
        <p class="auth-sub">Enter the access password to continue</p>
        <form class="auth-form" autocomplete="off">
          <input type="password" name="password" placeholder="Access password" required autofocus />
          <button type="submit" class="btn btn-primary">Unlock</button>
          <p class="auth-error" hidden>Incorrect password. Please try again.</p>
        </form>
        <p class="auth-foot">Powered by 5DM Africa</p>
      </div>
    </section>
  </template>

  <template id="tpl-dashboard">
    <section class="dashboard">
      <header class="topbar">
        <div class="brand">
          <img src="https://5dm.africa/wp-content/uploads/2025/05/Isolation_Mode.webp" alt="5DM" />
          <div>
            <h1>SEO Audit Platform</h1>
            <p>Dashboards · 5DM Africa</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-primary" data-action="new-audit">+ New Audit</button>
          <button class="btn btn-ghost" data-action="logout">Logout</button>
        </div>
      </header>

      <section class="dash-hero">
        <h2>All Audits</h2>
        <p>Click a card to open the branded audit report.</p>
      </section>

      <section class="audit-grid" data-audit-grid>
        <div class="empty-state" data-empty hidden>
          <h3>No audits yet</h3>
          <p>Create your first branded SEO audit to see it here.</p>
          <button class="btn btn-primary" data-action="new-audit">Start a new audit</button>
        </div>
      </section>
    </section>
  </template>

  <template id="tpl-card">
    <article class="audit-card" tabindex="0" role="button">
      <div class="audit-card-head">
        <div class="audit-card-logo"><img alt="" /></div>
        <div class="audit-card-score"><span data-score>0</span><small>/100</small></div>
      </div>
      <div class="audit-card-body">
        <h3 data-name></h3>
        <p data-url></p>
        <div class="audit-card-meta">
          <span data-date></span>
          <span class="pill" data-grade></span>
        </div>
        <div class="audit-card-pw">
          <span>Password</span>
          <code data-password></code>
          <button type="button" class="pw-copy" data-action="copy-pw" title="Copy password">Copy</button>
        </div>
      </div>
      <div class="audit-card-foot">
        <span class="open-link">Open audit →</span>
      </div>
    </article>
  </template>

  <template id="tpl-new-audit">
    <section class="wizard">
      <header class="topbar small">
        <a class="back" href="#" data-action="back">← Back to dashboard</a>
      </header>
      <div class="wizard-card">
        <h2>Create New SEO Audit</h2>
        <p class="muted">Provide the brand details and the site you want to audit. We will generate a personalized, downloadable audit report.</p>

        <form class="audit-form" novalidate>
          <div class="row">
            <label>
              <span>Brand Name *</span>
              <input type="text" name="brandName" required placeholder="e.g. Safaricom" />
            </label>
            <label>
              <span>Website URL *</span>
              <input type="text" inputmode="url" name="url" required placeholder="https://www.example.com" autocapitalize="off" autocorrect="off" spellcheck="false" />
            </label>
          </div>

          <div class="row">
            <label>
              <span>Primary Brand Color *</span>
              <input type="color" name="primaryColor" value="#00a651" />
            </label>
            <label>
              <span>Secondary Brand Color *</span>
              <input type="color" name="secondaryColor" value="#111111" />
            </label>
            <label>
              <span>Accent Color</span>
              <input type="color" name="accentColor" value="#ffd200" />
            </label>
          </div>

          <div class="row">
            <label class="logo-upload">
              <span>Brand Logo (PNG/SVG/WEBP, max 2MB)</span>
              <input type="file" name="logo" accept="image/png,image/jpeg,image/svg+xml,image/webp" />
              <div class="logo-preview" data-logo-preview>
                <span>Preview</span>
              </div>
            </label>
            <label>
              <span>Contact Email (optional)</span>
              <input type="email" name="contactEmail" placeholder="strategy@brand.com" />
            </label>
          </div>

          <div class="row">
            <label>
              <span>Share Password *</span>
              <div class="pw-field">
                <input type="text" name="auditPassword" autocomplete="off" spellcheck="false" required />
                <button type="button" class="pw-regen" data-action="regen-pw" title="Generate a new password">↻</button>
              </div>
              <small class="field-hint">Anyone opening the audit link will need this password. Share it alongside the link.</small>
            </label>
            <label class="full">
              <span>Audit Notes (optional)</span>
              <textarea name="notes" rows="3" placeholder="Any context we should include in the executive summary..."></textarea>
            </label>
          </div>

          <div class="wizard-actions">
            <button type="button" class="btn btn-ghost" data-action="back">Cancel</button>
            <button type="submit" class="btn btn-primary">Run SEO Audit</button>
          </div>
        </form>
      </div>
    </section>
  </template>

  <template id="tpl-running">
    <section class="wizard">
      <div class="wizard-card running">
        <div class="spinner"></div>
        <h2>Running SEO Audit…</h2>
        <p class="muted">This takes 20–60 seconds. Please don't close this tab.</p>
        <ul class="progress" data-progress>
          <li data-step="fetch">Fetching target site</li>
          <li data-step="parse">Analyzing on-page SEO</li>
          <li data-step="pagespeed">Running performance & accessibility audit</li>
          <li data-step="technical">Checking technical SEO signals</li>
          <li data-step="score">Computing scores & recommendations</li>
          <li data-step="finalize">Finalizing branded report</li>
        </ul>
      </div>
    </section>
  </template>

  <template id="tpl-report">
    <section class="report" data-report>
      <header class="report-topbar">
        <a class="back" href="#" data-action="back">← Back to dashboard</a>
        <div class="report-actions">
          <div class="view-toggle" role="tablist" aria-label="Report depth">
            <button type="button" data-mode="basic" class="active" role="tab" aria-selected="true">Basic</button>
            <button type="button" data-mode="granular" role="tab" aria-selected="false">Granular</button>
          </div>
          <button class="btn btn-ghost" data-action="copy-link">Copy Link</button>
          <button class="btn btn-primary" data-action="download-pdf">Download Full Audit</button>
        </div>
      </header>

      <article class="report-doc" id="report-doc" data-mode="basic">
        <section class="cover">
          <div class="cover-left">
            <img class="cover-logo" data-brand-logo alt="" />
            <div class="cover-title">
              <span data-mode-label>SEO Audit · Basic</span>
              <h1 data-brand-name></h1>
              <p data-brand-url></p>
            </div>
          </div>
          <div class="cover-right">
            <div class="score-ring" data-score-ring>
              <svg viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="52" class="ring-bg"></circle>
                <circle cx="60" cy="60" r="52" class="ring-fg" data-ring-fg></circle>
              </svg>
              <div class="ring-center"><strong data-score>0</strong><small>overall</small></div>
            </div>
            <div class="cover-meta">
              <div><span>Prepared</span><b data-date></b></div>
              <div><span>Grade</span><b data-grade></b></div>
              <div><span>Checks</span><b data-checks></b></div>
            </div>
          </div>
        </section>

        <section class="credentials" data-credentials hidden>
          <div class="credentials-head">
            <h3>Share Credentials</h3>
            <p>Visible only inside the 5DM dashboard. External viewers opening the public link will never see this panel.</p>
          </div>
          <div class="credentials-grid">
            <div>
              <span>Audit URL</span>
              <code data-cred-url></code>
            </div>
            <div>
              <span>Password</span>
              <code data-cred-pw></code>
            </div>
          </div>
        </section>

        <section class="narrative">
          <div class="narr-kicker">The Hidden Problem</div>
          <h2>Your website is quietly losing traffic, leads and revenue — and you may not know it yet.</h2>
          <p>
            Most brands pour effort into design and content without realising that search engines —
            the largest source of qualified traffic on the internet — are reading the same pages very
            differently. Missing structured data, slow Core Web Vitals, weak crawlability signals and
            thin content can compound into a silent tax on every marketing dollar you spend.
          </p>
          <div class="stat-grid">
            <div class="stat">
              <strong>68%</strong>
              <p>of all online experiences begin with a search engine (BrightEdge, 2024).</p>
            </div>
            <div class="stat">
              <strong>53%</strong>
              <p>of mobile visitors abandon pages that take longer than 3 seconds to load (Google).</p>
            </div>
            <div class="stat">
              <strong>#1</strong>
              <p>organic result on Google earns an average click-through rate of 27.6% (Backlinko, 2023).</p>
            </div>
            <div class="stat">
              <strong>90.6%</strong>
              <p>of indexed pages get zero search traffic from Google (Ahrefs content study).</p>
            </div>
          </div>
        </section>

        <section class="narrative stakes">
          <div class="narr-kicker">What's at Stake</div>
          <h2>The difference between a healthy SEO foundation and an overlooked one is measured in market share.</h2>
          <p>
            Competitors who invest in technical SEO, performance and content depth are compounding
            their visibility every month. Brands that don't — even excellent ones — slowly drift
            down the results, lose branded share of voice, and become dependent on paid acquisition
            to maintain pipeline. The fix isn't a single dramatic rewrite; it's a structured sequence
            of improvements, prioritised by impact.
          </p>
        </section>

        <section class="exec-summary">
          <h2>Executive Summary</h2>
          <p data-summary></p>
          <div class="pillars" data-pillars></div>
        </section>

        <section class="narrative methodology">
          <div class="narr-kicker">The Audit Methodology</div>
          <h2>How this audit was produced — step by step.</h2>
          <p>
            Every audit from the 5DM SEO platform follows the same seven-stage methodology. The goal
            is to assess the site from the perspective of both a search engine crawler and a real
            user on a slow mobile connection — then surface the highest-leverage fixes.
          </p>
          <ol class="method-steps">
            <li>
              <h4>Step 1 · Crawl &amp; Retrieve the Target URL</h4>
              <p>We fetch the live HTML using multiple fallback proxies to defeat rate-limiting. This ensures we evaluate the page that search engines and real users actually receive — including server-rendered content, meta tags and inline structured data.</p>
            </li>
            <li>
              <h4>Step 2 · On-Page SEO Extraction</h4>
              <p>Every element that matters to search engines is pulled apart: title tag, meta description, canonical, robots directives, viewport, headings hierarchy, image alt text, internal and external link profile. Each signal is measured against Google's documented best practices.</p>
            </li>
            <li>
              <h4>Step 3 · Technical Crawlability</h4>
              <p>We probe <code>robots.txt</code> and <code>sitemap.xml</code>, verify HTTPS, check the canonical host behaviour and look for indexing blockers. These are the foundational guards that decide whether your content is even eligible to rank.</p>
            </li>
            <li>
              <h4>Step 4 · Performance &amp; Core Web Vitals</h4>
              <p>We run Google Lighthouse (mobile strategy) via the PageSpeed Insights API and pull field data from the Chrome UX Report where available. LCP, INP, CLS and Total Blocking Time are measured — these are ranking signals and conversion-critical UX metrics.</p>
            </li>
            <li>
              <h4>Step 5 · Accessibility &amp; Best Practices</h4>
              <p>Automated WCAG 2.1 AA checks run through Lighthouse — contrast ratios, tap-target sizes, ARIA correctness, semantic markup, image alternatives. Accessibility improvements almost always lift SEO and conversion in parallel.</p>
            </li>
            <li>
              <h4>Step 6 · Content &amp; Social Signals</h4>
              <p>We measure content depth, the presence of structured data (JSON-LD), Open Graph and Twitter Card coverage, language declarations and international (hreflang) targeting. These govern how your content appears across Google, LinkedIn, WhatsApp, X and more.</p>
            </li>
            <li>
              <h4>Step 7 · Score, Prioritise &amp; Recommend</h4>
              <p>Each pillar is scored 0–100 and weighted into a composite overall score. Findings are classified pass / warn / fail. The highest-impact remediations float to the top of the Priority Recommendations list — the exact order to work them in.</p>
            </li>
          </ol>
        </section>

        <section class="section" data-section="onpage">
          <h2>On-Page SEO</h2>
          <p class="section-intro">On-page SEO is the set of signals you directly control inside each page's HTML — the title, meta description, headings, internal links and image alt text. When these are tight, search engines understand exactly what the page is about, and users click through more often. When they're loose, you leak traffic to competitors who simply wrote clearer titles.</p>
          <div class="findings" data-findings="onpage"></div>
        </section>

        <section class="section" data-section="technical">
          <h2>Technical SEO</h2>
          <p class="section-intro">Technical SEO controls whether search engines can even reach, render and index your pages. A broken robots.txt, a missing sitemap, a blocked resource or a wrong canonical can quietly remove whole sections of a site from the index. This pillar is the foundation everything else sits on.</p>
          <div class="findings" data-findings="technical"></div>
        </section>

        <section class="section" data-section="performance">
          <h2>Performance &amp; Core Web Vitals</h2>
          <p class="section-intro">Google ranks faster pages higher and real users abandon slow ones — the correlation between speed and both conversion and ranking is now well-documented. These findings come from Google Lighthouse (mobile) plus real-user field data where available. Target: Largest Contentful Paint under 2.5s, Interaction to Next Paint under 200ms, Cumulative Layout Shift under 0.1.</p>
          <div class="findings" data-findings="performance"></div>
        </section>

        <section class="section" data-section="accessibility">
          <h2>Accessibility</h2>
          <p class="section-intro">Accessibility ensures your content is usable by everyone — including people using screen readers, keyboard navigation, or low-vision configurations. It's a legal requirement in many markets, it overlaps heavily with SEO (semantic markup, alt text, labelled controls) and it measurably expands your addressable audience.</p>
          <div class="findings" data-findings="accessibility"></div>
        </section>

        <section class="section" data-section="content">
          <h2>Content Signals</h2>
          <p class="section-intro">Content is how you prove topical authority. This pillar checks content depth, the presence of structured data (JSON-LD for Organization, WebSite, Article, Product, LocalBusiness and more), declared language, and international targeting. Strong content signals unlock rich results, featured snippets and higher click-through rates.</p>
          <div class="findings" data-findings="content"></div>
        </section>

        <section class="section" data-section="social">
          <h2>Social &amp; Sharing</h2>
          <p class="section-intro">Open Graph and Twitter Card metadata dictate how your links render when they're shared to Facebook, LinkedIn, WhatsApp, Slack, X and other platforms. A missing or malformed preview is a missed branding moment every single time someone shares your content — and it measurably reduces social click-through rates.</p>
          <div class="findings" data-findings="social"></div>
        </section>

        <section class="section" data-section="security">
          <h2>Security &amp; Trust</h2>
          <p class="section-intro">HTTPS is a confirmed Google ranking signal and browsers now display warnings on insecure pages. This pillar also considers canonical host behaviour (www vs. apex) — an often-overlooked detail that can split your link authority across two hostnames.</p>
          <div class="findings" data-findings="security"></div>
        </section>

        <section class="section recommendations">
          <h2>Priority Recommendations</h2>
          <p class="section-intro">These are the highest-impact fixes we surfaced, ordered by priority. Addressing the High-priority items typically unlocks the biggest movement in overall score — and compounds over the following weeks as search engines re-crawl and re-index your pages.</p>
          <ol data-recommendations></ol>
        </section>

        <section class="closing">
          <h2>The Path Forward</h2>
          <p>
            The findings above are not a verdict — they're a map. Work the Priority Recommendations
            top-down, starting with the critical (red) items and then the warnings. Re-run this
            audit in 30 days to measure the lift. SEO compounds: every fix you ship today earns
            interest every month thereafter as search engines re-crawl and re-rank.
          </p>
          <p>
            For strategic implementation — content production, technical engineering, link-building,
            GEO and analytics — partner with the 5DM team. We take brands from discovery to sustained
            organic dominance.
          </p>
        </section>

        <footer class="report-footer">
          <img src="https://5dm.africa/wp-content/uploads/2025/05/Isolation_Mode.webp" alt="5DM Africa" />
          <div>
            <strong>Reported by 5DM Africa</strong>
            <p>This audit was generated by the 5DM SEO Audit Platform. For strategic implementation and ongoing SEO support, partner with the 5DM team.</p>
            <small>5dm.africa · dashboards.5dm.africa/SEO</small>
          </div>
        </footer>
      </article>
    </section>
  </template>

        <p class="auth-foot">Protected by 5DM Africa</p>

  </template>
