name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/seo-audit-platform-dtqrj
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site (nest under /SEO)
        run: |
          set -euo pipefail
          mkdir -p _site/SEO
          # Copy everything except build artifacts / git / workflows into /SEO
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='node_modules' \
            ./ _site/SEO/
          # Root index redirects visitors from the apex to /SEO/
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html><head>
            <meta charset="UTF-8"/>
            <title>5DM SEO Audit Platform</title>
            <meta http-equiv="refresh" content="0; url=./SEO/">
            <link rel="canonical" href="./SEO/"/>
          </head><body>
            <script>window.location.replace("./SEO/");</script>
            <p>Redirecting to <a href="./SEO/">/SEO/</a>…</p>
          </body></html>
          HTML
          # Root 404 forwards any /something path to /SEO/?redirect=/something
          cp _site/SEO/404.html _site/404.html
          # Custom domain for GitHub Pages
          echo "dashboards.5dm.africa" > _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
