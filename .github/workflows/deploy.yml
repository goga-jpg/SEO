name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/seo-audit-platform-dtqrj
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          set -euo pipefail
          mkdir -p _site
          # Publish the platform at the GitHub Pages root.
          # The client-side router auto-detects its base path, so this
          # works at https://<user>.github.io/<repo>/ AND at
          # https://dashboards.5dm.africa/SEO/ once uploaded there.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='node_modules' \
            ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
